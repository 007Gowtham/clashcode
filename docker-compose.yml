services:
  postgres:
    image: postgres:16-alpine
    container_name: clashcode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-codearena_auth}
      POSTGRES_USER: ${DB_USERNAME:-codearena}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codearena_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-codearena} -d ${DB_NAME:-codearena_auth}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clashcode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clashcode-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-codearena_auth}
      DB_USERNAME: ${DB_USERNAME:-codearena}
      DB_PASSWORD: ${DB_PASSWORD:-codearena_secret}
      JWT_SECRET: ${JWT_SECRET:-verySecretJwtSigningKeyForCodeArenaMultiplayerCompetitionPlatformMustBeAtLeast32Bytes!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clashcode-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8080/ws}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
