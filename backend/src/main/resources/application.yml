server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: clashcode

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codearena_auth}}
    username: ${DB_USERNAME:codearena}
    password: ${DB_PASSWORD:codearena_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:verySecretJwtSigningKeyForCodeArenaMultiplayerCompetitionPlatformMustBeAtLeast32Bytes!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cookie-name: ${JWT_COOKIE_NAME:access_token}
  cookie-secure: ${JWT_COOKIE_SECURE:false} # Set to true in production over HTTPS
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
