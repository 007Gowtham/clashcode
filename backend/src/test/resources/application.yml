server:
  port: 8080

spring:
  application:
    name: codearena-auth-test

  datasource:
    url: jdbc:h2:mem:codearena_auth_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

jwt:
  secret: testSecretKeyForTestingPurposesOnlyNeedsToBeAtLeast32BytesLong12345!
  expiration-ms: 3600000
  cookie-name: access_token
  cookie-secure: false
  cookie-same-site: Lax

cors:
  allowed-origins: http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
