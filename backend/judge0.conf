# ── Database ──────────────────────────────────────────────────────────────────
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0pass

# ── Redis ─────────────────────────────────────────────────────────────────────
REDIS_HOST=judge0-redis
REDIS_PORT=6379

# ── Security (blank = no auth needed for local dev) ───────────────────────────
# Set a secret here if you deploy this publicly e.g: AUTHN_TOKEN=mysecrettoken
AUTHN_TOKEN=

# ── CORS (allow your frontend/backend to call Judge0) ─────────────────────────
CORS_ORIGIN=*

# ── Execution Limits ──────────────────────────────────────────────────────────
CPU_TIME_LIMIT=5
WALL_TIME_LIMIT=10
MEMORY_LIMIT=262144
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_NETWORK=false

# ── Workers ───────────────────────────────────────────────────────────────────
COUNT_OF_WORKERS=2