services:
  mongo:
    image: mongo:7
    container_name: clashcode-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: clashcode

  executor:
    build: 
      context: .
      dockerfile: Dockerfile.executor
    container_name: clashcode-executor
    restart: unless-stopped
    # Add strict memory limits to the sandbox
    mem_limit: 512m
    cpus: 1

volumes:
  mongo_data: